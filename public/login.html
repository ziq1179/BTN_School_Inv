<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — BY THE NUMB3RS School Inventory</title>
  <meta name="description" content="School inventory, sales and reporting — uniforms, books and supplies, all in one place." />
  <link rel="icon" type="image/png" href="/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="login-page">
    <div class="card login-card">
      <div class="login-logo">
        <img src="/logo.png" alt="BY THE NUMB3RS logo" class="login-logo-img" />
        <h1>BY THE NUMB<span style="color:var(--accent-blue)">3</span>RS</h1>
        <div class="sub">School Inventory</div>
      </div>
      <div class="login-error" id="login-error"></div>
      <form id="login-form">
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" required placeholder="you@yourschool.com" autocomplete="email" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" required placeholder="••••••••" autocomplete="current-password" />
        </div>
        <div class="form-actions" style="margin-top: 24px; padding-top: 0; border: none;">
          <button type="submit" class="btn btn-primary" style="width: 100%;" id="login-btn">Sign In</button>
        </div>
      </form>
      <div class="auth-alt">New here? <a href="/signup.html">Create your school account →</a></div>
    </div>
  </div>
  <script>
    const API = window.location.origin + '/api';
    const errEl = document.getElementById('login-error');
    const form = document.getElementById('login-form');
    const btn = document.getElementById('login-btn');

    function showError(msg, isInfo) {
      errEl.textContent = msg;
      errEl.classList.add('visible');
      errEl.classList.toggle('info', !!isInfo);
    }
    function hideError() {
      errEl.classList.remove('visible');
    }

    async function fetchWithRetry(url, opts) {
      const maxRetries = 4;
      const retryDelay = 20000;
      for (let attempt = 1; attempt <= maxRetries; attempt++) {
        try {
          const res = await fetch(url, opts);
          if ((res.status === 502 || res.status === 503 || res.status === 504) && attempt < maxRetries) {
            showError('Server is waking up. Please wait ' + (attempt * 20) + 's…', true);
            await new Promise(r => setTimeout(r, retryDelay));
            continue;
          }
          return res;
        } catch (err) {
          if (attempt < maxRetries) {
            showError('Server is waking up. Retrying in 20s…', true);
            await new Promise(r => setTimeout(r, retryDelay));
          } else throw err;
        }
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();
      btn.disabled = true;
      btn.textContent = 'Signing in...';
      try {
        const fd = new FormData(form);
        const res = await fetchWithRetry(API + '/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ email: fd.get('email'), password: fd.get('password') }),
        });
        let data;
        try {
          data = await res.json();
        } catch {
          showError('Server error. Please try again.');
          return;
        }
        if (!data.success) {
          showError(data.error || 'Login failed');
          return;
        }
        window.location.href = '/';
      } catch (err) {
        showError('Cannot connect to server. Please try again.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
